<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visual-Layer (Canvas/OCR) Concealment</title>
</head>
<body>
  <!-- Injected prompt rendered as low-opacity canvas pixels.
       Absent from the DOM, raw HTML, and accessibility tree;
       recoverable only by clients that rasterize the page and apply OCR. -->
  <canvas id="hid" width="900" height="16"></canvas>
  <script>
    var c = document.getElementById('hid').getContext('2d');
    c.font = '15px sans-serif';
    c.fillStyle = 'rgba(180,180,180,0.15)';
    c.fillText('<injected prompt text>', 10, 12);
  </script>
</body>
</html>
